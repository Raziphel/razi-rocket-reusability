[mod-setting-description]
enable-incomplete-rocket-parts=Changes how rockets are constructed.\nMainly intended for balance, as you could just launch rockets and get infinite processing units and LDS without it.\nRecommended setting is enabled.
enable-incomplete-rocket-parts-productivity=Allows productivity for incomplete rocket parts. Could be extremely broken with highest tier modules.\nRecommended setting is disabled.
razi-rocket-reusability-recovery-chance=Chance to produce a wreck per eligible rocket launch. Default: 100%.
razi-rocket-reusability-spawn-distance=Minimum lead distance ahead of the hub, in tiles. Long platforms automatically push spawn positions clear of the forward hull. Default: 64.
razi-rocket-reusability-allow-modded-platforms=Enable to include any constructed platform, including modded starter packs. Disable to use only allowed starter packs.
razi-rocket-reusability-max-active-wrecks=Limit the number of intact used rockets on any single platform. If a platform is full, other available platforms may receive wrecks instead. Default: 3.
razi-rocket-reusability-side-arrivals=WARNING: Makes recovery harder! Rocket wrecks may approach from either SIDE of your platform, bypassing front-facing turrets and collectors. Add side defenses. Off by default; can be changed during a game. Does not increase the total number of wrecks.
razi-rocket-reusability-side-arrival-chance=Percentage of eligible wrecks that attempt a left or right approach when side arrivals are enabled. Default: 35%. Set to 100% for side-first arrivals or 0% to keep front-only spawns. If both sides are unsafe, recovery falls back to the front.
debug-mode=Write diagnostic messages to factorio-current.log. Recommended: disabled.

