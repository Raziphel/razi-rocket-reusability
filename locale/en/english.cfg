[technology-description]
rocket-chunk-processing=Enables used rockets drifting around in orbit. Chunks can be reprocessed into rocket ingredients except fuel.
remnant-beacon=Remnant Beacons attract used rockets when placed on a platform. Fully powered beacons prioritize their platform for receiving recoverable wrecks. Beacons do not increase the wreck count.